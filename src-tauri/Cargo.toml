[package]
name = "socket-tester"
version = "0.1.0"
description = "TCP/UDP 报文收发与重放工具"
authors = ["you"]
edition = "2024"

[lib]
name = "socket_tester_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "net",
    "sync",
    "time",
    "io-util",
    "macros",
] }
chrono = "0.4"
if-addrs = "0.13"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
